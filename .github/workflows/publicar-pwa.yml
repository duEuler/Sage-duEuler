name: Publicar PWA da família

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/publicar-pwa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-familia
  cancel-in-progress: false

jobs:
  preparar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Preparar apenas os arquivos públicos
        run: |
          set -eu
          mkdir site
          for file in index.html familia.css manifest.webmanifest sw.js app.js \
            icone-192.png icone-512.png atualizacoes.json acolhimento.md acolhimento.json editorial.md perfis.json; do
            test -f "docs/$file" && test ! -L "docs/$file"
            cp "docs/$file" "site/$file"
          done
          node --check site/app.js
          node --check site/sw.js
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
  publicar:
    needs: preparar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
