name: Publicar PWA da família

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'irmaos/**'
      - 'sage_dueuler_manifesto.md'
      - 'tools/gerar-biblioteca.mjs'
      - '.github/workflows/publicar-pwa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-familia
  cancel-in-progress: false

jobs:
  preparar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Preparar apenas os arquivos públicos
        run: |
          set -eu
          node tools/gerar-biblioteca.mjs --check
          mkdir -p site/retratos
          for file in index.html familia.css manifest.webmanifest sw.js app.js push-config.js push-firebase.js \
            icone-192.png icone-512.png atualizacoes.json acolhimento.md acolhimento.json editorial.md perfis.json biblioteca.html biblioteca.json \
            retratos/sage.webp retratos/rodrigo.webp retratos/pabblo.webp; do
            test -f "docs/$file" && test ! -L "docs/$file"
            cp "docs/$file" "site/$file"
          done
          node --check site/app.js
          node --check site/sw.js
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
  publicar:
    needs: preparar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
  avisar:
    needs: publicar
    if: vars.FIREBASE_PUSH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: firebase
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: lutandopelahumanidade
          workload_identity_provider: ${{ vars.FIREBASE_PUSH_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FIREBASE_PUSH_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: false
      - name: Enviar a edição pública aos inscritos
        env:
          FIREBASE_PUSH_ACCESS_TOKEN: ${{ steps.firebase.outputs.access_token }}
        run: node firebase/enviar-push.mjs
