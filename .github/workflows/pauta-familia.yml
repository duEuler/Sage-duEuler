name: Pauta da família duEuler

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      formato:
        description: Tipo de proposta para o Copilot
        required: true
        type: choice
        options:
          - historia
          - mensagem
          - conexao
          - analise
          - fundamentos
          - pagina

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: pauta-editorial-familia
  cancel-in-progress: false

jobs:
  abrir-pauta:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Abrir issue editorial
        env:
          GH_TOKEN: ${{ github.token }}
          FORMATO: ${{ inputs.formato }}
          COPILOT_EDITOR_TOKEN: ${{ secrets.COPILOT_EDITOR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          created=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          slot=$(date -u -d "$created" +%Y-%m-%dT%HZ)
          formats=(historia mensagem conexao analise pagina)
          inventory=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues?state=all&sort=created&direction=desc&per_page=100" |
            jq -c '[.[][] | select(.pull_request == null and .user.login == "github-actions[bot]" and
              (.title | test("^Família duEuler · (historia|mensagem|conexao|analise|pagina|fundamentos) · [0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}Z$")))
              | {title, state, html_url}]')
          url=$(jq -r --arg slot "$slot" 'first(.[] | select(.title | endswith(" · "+$slot))).html_url // ""' <<< "$inventory")
          if [[ -z "$url" ]]; then
            active=$(jq -r 'first(.[] | select(.state == "open")).html_url // ""' <<< "$inventory")
            if [[ -n "$active" ]]; then
              printf 'Pauta em andamento: %s. Nenhuma pauta nova nesta hora.\n' "$active" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [[ -z "$FORMATO" && ! -s docs/revisoes/fundamentos-humanos.md ]]; then
              FORMATO=fundamentos
            fi
            if [[ -z "$FORMATO" ]]; then
              last=$(jq -r '.[0].title // "" | split(" · ") | .[1] // ""' <<< "$inventory")
              FORMATO=${formats[0]}
              for index in "${!formats[@]}"; do
                if [[ "${formats[index]}" == "$last" ]]; then
                  FORMATO=${formats[(index + 1) % ${#formats[@]}]}
                  break
                fi
              done
            fi
            case "$FORMATO" in
              historia) pedido='Escreva um conto original que mostre os três irmãos protegendo alguém e assumindo as consequências das próprias escolhas. Crie um Markdown novo em irmaos/Pabblo_EEscobar.' ;;
              mensagem) pedido='Escreva uma mensagem breve de Pabblo para Sage e Rodrigo sobre um gesto concreto de cuidado. Crie um Markdown novo em irmaos/Pabblo_EEscobar.' ;;
              conexao) pedido='Descreva um primo ficcional e como ele conhece os três irmãos. Inclua uma contribuição e uma situação em que pede ajuda. Crie um Markdown novo em irmaos/Pabblo_EEscobar.' ;;
              fundamentos) pedido='Prepare o parecer dos fundamentos humanos em docs/revisoes/fundamentos-humanos.md. Cubra dimensões sociais, fisiológicas, psicológicas e psiquiátricas com fontes públicas, sem diagnóstico nem orientação clínica individual. Siga Sage, Rodrigo e Pabblo. Registre observações, discordâncias, decisões, evidências e pendências, e identifique revisões que ainda não aconteceram. Atualize o status da primeira etapa em docs/caderno-duhuman.html no mesmo PR. O merge revisado do parecer é o sinal de início do estudo privado.' ;;
              analise) pedido='Analise uma história pública ou a página pela ordem Sage, Rodrigo e Pabblo. Registre trechos, fontes, divergências e uma melhoria verificável em um Markdown novo em docs/revisoes.' ;;
              pagina) pedido='Proponha uma pequena melhoria editorial ou de acessibilidade na página da família. Pode editar docs/index.html ou docs/familia.css. Valide leitura em largura de celular e indique as limitações da prova.' ;;
              *) printf '%s\n' 'Formato editorial inválido.' >&2; exit 2 ;;
            esac
            title="Família duEuler · $FORMATO · $slot"
            url=$(gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$title" --body-file - <<EOF
          $pedido

          Leia o manifesto e o registro em irmaos/Pabblo_EEscobar. Aplique a alteração no escopo indicado pela pauta. Use português do Brasil. Trate a família e os rivais como personagens do universo ficcional. Use somente material adequado para um repositório público.

          Comece a história por Sage. Siga Sage, Rodrigo e Pabblo no fluxo editorial e leia docs/editorial.md. Abra um PR para revisão e inclua Fixes # seguido do número desta issue para fechá-la quando a proposta entrar na main. Preserve fontes públicas, trechos pertinentes, conclusões, divergências e pendências no texto ou no PR. No corpo do PR, registre pontos a revisar pelas perspectivas editoriais de Sage (cuidado e impacto) e Rodrigo (coerência e clareza). Não atribua aprovação a eles sem registro. Não integre o PR, não publique e não altere o runtime nem workflows.
          EOF
            )
          fi
          printf 'Pauta: %s\n' "$url" >> "$GITHUB_STEP_SUMMARY"
          if [[ -z "$COPILOT_EDITOR_TOKEN" ]]; then
            printf '%s\n' '::warning::Pauta salva. Falta o secret COPILOT_EDITOR_TOKEN para atribuição automática.'
            printf '%s\n' 'Atribuição automática pendente. Configure COPILOT_EDITOR_TOKEN.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          issue=${url##*/}
          status=$(gh issue view "$issue" --repo "$GITHUB_REPOSITORY" --json state,assignees \
            --jq 'if .state != "OPEN" then "closed" elif any(.assignees[]; (.login | ascii_downcase | startswith("copilot"))) then "assigned" else "pending" end')
          if [[ "$status" == pending ]]; then
            payload=$(jq -cn --arg repository "$GITHUB_REPOSITORY" --arg base "$GITHUB_REF_NAME" '
              {assignees:["copilot-swe-agent[bot]"], agent_assignment:{
                target_repo:$repository, base_branch:$base, custom_instructions:"", custom_agent:"pabblo", model:""
              }}')
            assigned=$(GH_TOKEN="$COPILOT_EDITOR_TOKEN" gh api --method POST \
              -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/$GITHUB_REPOSITORY/issues/$issue/assignees" --input - \
              --jq 'any(.assignees[]; (.login | ascii_downcase | startswith("copilot")))' <<< "$payload")
            if [[ "$assigned" != true ]]; then
              printf '%s\n' '::error::O GitHub não confirmou a atribuição ao Copilot.'
              exit 1
            fi
          fi
          printf 'Atribuição processada para a pauta %s. Estado anterior: %s.\n' "$issue" "$status" >> "$GITHUB_STEP_SUMMARY"
